name: Build Windows exe

# Runs on an actual GitHub-hosted Windows machine — no Windows box needed
# locally. Two ways to trigger it:
#   1. Push a tag like "v0.4.0"  → builds AND attaches the .exe to a
#      GitHub Release automatically.
#   2. Manually from the Actions tab ("Run workflow") → just builds and
#      uploads the .exe as a downloadable build artifact, no release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller autocatcher.spec

      - name: Smoke test the built exe
        run: .\dist\autocatcher.exe --help

      # Always upload as a build artifact, tag push or not — lets you grab
      # the .exe from any run (e.g. to test a branch) without needing a
      # release at all.
      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocatcher-windows
          path: dist/autocatcher.exe
          retention-days: 30

      # Only attach to a GitHub Release when the trigger was an actual
      # version tag (e.g. "v0.4.0") — a plain manual run won't publish
      # anything public, just the artifact above.
      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/autocatcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
