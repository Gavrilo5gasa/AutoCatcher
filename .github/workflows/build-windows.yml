name: Build Windows exe

# Runs on an actual GitHub-hosted Windows machine — no Windows box needed
# locally. Two ways to trigger it:
#   1. Push a tag like "v0.4.0"  → builds AND attaches the .exe to a
#      GitHub Release automatically.
#   2. Manually from the Actions tab ("Run workflow") → just builds and
#      uploads the .exe as a downloadable build artifact, no release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller autocatcher.spec

      - name: Smoke test the CLI exe
        run: .\dist\autocatcher-cli.exe --help

      # The GUI exe is windowed (no stdout), so --help can't be used. With
      # AUTOCATCHER_SELFTEST set it builds the main window, then exits 0.
      # A crash on import/startup shows up as a non-zero code or a timeout.
      - name: Smoke test the GUI exe
        shell: pwsh
        run: |
          $log = Join-Path $PWD "gui_selftest.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:AUTOCATCHER_SELFTEST = "1"
          $env:AUTOCATCHER_LOG = $log
          $p = Start-Process .\dist\AutoCatcher.exe -PassThru
          $done = $p.WaitForExit(90000)
          if (-not $done) { taskkill /F /T /PID $p.Id | Out-Null }   # kills the onefile child too
          Write-Host "---- GUI selftest log ----"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log written - exe never reached Python code)" }
          Write-Host "--------------------------"
          if (-not $done) { throw "GUI exe hung on startup (see log above)" }
          if ($p.ExitCode -ne 0) { throw "GUI exe exited with code $($p.ExitCode)" }

      - name: Upload exes as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocatcher-windows
          path: |
            dist/AutoCatcher.exe
            dist/autocatcher-cli.exe
          retention-days: 30

      # Only attach to a GitHub Release when the trigger was an actual
      # version tag (e.g. "v0.4.0") — a plain manual run won't publish
      # anything public, just the artifact above.
      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoCatcher.exe
            dist/autocatcher-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
